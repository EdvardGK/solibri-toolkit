TITLE=Zone Scope Filter
DESCRIPTION=Flags components outside a specified building zone and/or storey elevation range. Uses clash zone footprint polygons for oriented containment.
AUTHOR=Skiplum AS
UID=skiplum-zone-scope-001

rpZoneName.TITLE=Zone Name
rpZoneName.DESCRIPTION=Name of the zone component to scope to (e.g., KvB_Zone).

rpCheckElevation.TITLE=Check Elevation
rpCheckElevation.DESCRIPTION=Also filter by storey elevation range.

rpMinElevation.TITLE=Min Elevation
rpMinElevation.DESCRIPTION=Minimum bottom elevation (mm) for storey filtering.

rpMaxElevation.TITLE=Max Elevation
rpMaxElevation.DESCRIPTION=Maximum bottom elevation (mm) for storey filtering.
